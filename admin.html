<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - EarnPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center">
    <!-- Admin Login -->
    <div id="admin-login-box" class="bg-slate-800 p-8 rounded-2xl border border-slate-700 w-full max-w-md space-y-4">
        <h2 class="text-2xl font-bold text-center text-indigo-400">Admin Login</h2>
        <input type="text" id="admin-user" placeholder="Supabase User ID" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg">
        <input type="password" id="admin-pass" placeholder="Password" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg">
        <button onclick="adminLogin()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold">Login to Panel</button>
    </div>

    <!-- Admin Dashboard (Hidden initially) -->
    <div id="admin-dashboard" class="hidden max-w-2xl w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 space-y-6">
        <h2 class="text-2xl font-bold text-indigo-400">Admin Control Panel</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Welcome Bonus Amount (₹)</label>
                <input type="number" id="admin-bonus" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg">
            </div>
            
            <div class="flex items-center space-x-3">
                <input type="checkbox" id="admin-scratch-toggle" class="w-5 h-5">
                <label class="text-sm font-medium">Enable Daily Scratch Card</label>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Commission Levels (Comma separated, e.g. 10,5,3,2,1,0.5,0.25)</label>
                <input type="text" id="admin-levels" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg">
            </div>

            <button onclick="saveAdminSettings()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold">Save Settings</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
