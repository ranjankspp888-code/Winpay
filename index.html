<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winpay - Login & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <h2 id="form-title" class="text-2xl font-bold mb-6 text-center text-indigo-400">Login to Winpay</h2>
        
        <!-- Form -->
        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
            <div id="name-field" class="hidden">
                <label class="block text-sm font-medium mb-1">Full Name</label>
                <input type="text" id="name" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Mobile Number</label>
                <input type="text" id="mobile" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500">
            </div>
            <div id="email-field" class="hidden">
                <label class="block text-sm font-medium mb-1">Email Address</label>
                <input type="email" id="email" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500">
            </div>
            <div id="refer-field" class="hidden">
                <label class="block text-sm font-medium mb-1">Referral Code</label>
                <input type="text" id="refer_code" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500">
            </div>
            
            <button type="submit" id="submit-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold transition duration-200">Login</button>
        </form>

        <!-- Switch & Forgot Links -->
        <div class="mt-6 text-center text-sm space-y-2">
            <p><button type="button" onclick="toggleMode()" id="switch-mode" class="text-indigo-400 hover:underline bg-transparent border-none cursor-pointer">Don't have an account? Register</button></p>
            <p><button type="button" onclick="forgotPassword()" class="text-slate-400 hover:underline bg-transparent border-none cursor-pointer">Forgot Password?</button></p>
        </div>
    </div>

    <!-- Custom Alert Popup -->
    <div id="custom-alert" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-sm w-full text-center space-y-4">
            <div class="w-12 h-12 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
            <h3 class="text-xl font-bold text-white">Welcome!</h3>
            <div id="alert-content" class="text-slate-300 text-sm space-y-1"></div>
            <button onclick="closeAlert()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold">Continue to Dashboard</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nzjpeofntgmmxuwpvgrb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_EMtwDM6VuGCoWElwvE2K7w_GvjIJGg-';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isRegisterMode = false;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            if (ref) {
                isRegisterMode = false;
                toggleMode();
                const referInput = document.getElementById('refer_code');
                if (referInput) referInput.value = ref;
            }
        });

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            
            const title = document.getElementById('form-title');
            const btn = document.getElementById('submit-btn');
            const switchText = document.getElementById('switch-mode');
            
            if (title) title.innerText = isRegisterMode ? "Register to Winpay" : "Login to Winpay";
            if (btn) btn.innerText = isRegisterMode ? "Register" : "Login";
            if (switchText) switchText.innerText = isRegisterMode ? "Already have an account? Login" : "Don't have an account? Register";
            
            const nameField = document.getElementById('name-field');
            const emailField = document.getElementById('email-field');
            const referField = document.getElementById('refer-field');
            
            if (nameField) nameField.classList.toggle('hidden', !isRegisterMode);
            if (emailField) emailField.classList.toggle('hidden', !isRegisterMode);
            if (referField) referField.classList.toggle('hidden', !isRegisterMode);
        }

        function generateUniqueId() {
            return Math.floor(10000 + Math.random() * 90000).toString();
        }

        async function handleAuth(event) {
            event.preventDefault();
            const mobile = document.getElementById('mobile').value;
            const password = document.getElementById('password').value;

            if (isRegisterMode) {
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const referCodeInput = document.getElementById('refer_code').value;
                const userId = generateUniqueId();
                
                let welcomeBonus = 50;
                try {
                    const { data: settings } = await supabase.from('settings').select('value').eq('key', 'config').single();
                    if (settings && settings.value) {
                        welcomeBonus = settings.value.welcome_bonus || 50;
                    }
                } catch (err) {}

                const { error } = await supabase.from('users').insert([{
                    user_id: userId,
                    name: name,
                    mobile: mobile,
                    email: email,
                    password: password,
                    refer_code: userId,
                    referred_by: referCodeInput || null,
                    wallet: welcomeBonus
                }]);

                if (error) {
                    alert('Registration Error: ' + error.message);
                    return;
                }

                const alertContent = document.getElementById('alert-content');
                const customAlert = document.getElementById('custom-alert');
                
                if (alertContent) {
                    alertContent.innerHTML = `
                        <p><b>User Name:</b> ${name}</p>
                        <p><b>User ID:</b> ${userId}</p>
                        <p><b>Password:</b> ${password}</p>
                        <p class="text-green-400 mt-2">Welcome Bonus ₹${welcomeBonus} added to wallet!</p>
                    `;
                }
                if (customAlert) customAlert.classList.remove('hidden');
                localStorage.setItem('currentUser', JSON.stringify({ user_id: userId, name, mobile, email }));
            } else {
                const { data, error } = await supabase.from('users').select('*').eq('mobile', mobile).eq('password', password).single();
                if (error || !data) {
                    alert('Invalid Mobile Number or Password');
                    return;
                }
                localStorage.setItem('currentUser', JSON.stringify(data));
                window.location.href = 'dashboard.html';
            }
        }

        async function forgotPassword() {
            const inputVal = prompt("Enter your registered Mobile Number or Email:");
            if (!inputVal) return;

            const { data, error } = await supabase.from('users')
                .select('*')
                .or(`mobile.eq.${inputVal},email.eq.${inputVal}`)
                .single();

            if (error || !data) {
                alert('No account found with this details.');
                return;
            }

            if (!data.email) {
                alert('No email address found for this account.');
                return;
            }

            const subject = encodeURIComponent("Your Winpay Password Recovery");
            const body = encodeURIComponent(`Hello ${data.name},\n\nYour Account Details:\nUser ID: ${data.user_id}\nMobile: ${data.mobile}\nPassword: ${data.password}`);
            
            window.location.href = `mailto:${data.email}?subject=${subject}&body=${body}`;
            alert('Email app opened. Send the email to receive your password.');
        }

        function closeAlert() {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
