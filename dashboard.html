<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EarnPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center sticky top-0 z-50">
        <div class="relative">
            <button onclick="toggleProfileMenu()" class="flex items-center space-x-2 focus:outline-none">
                <div id="user-dp" class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center font-bold">U</div>
            </button>
            <!-- Profile Card & Menu Dropdown -->
            <div id="profile-menu" class="hidden absolute left-0 mt-2 w-64 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-4 space-y-3">
                <div class="border-b border-slate-700 pb-3">
                    <p id="menu-name" class="font-bold text-white"></p>
                    <p id="menu-id" class="text-xs text-indigo-400"></p>
                    <p id="menu-mobile" class="text-xs text-slate-400"></p>
                </div>
                <div class="space-y-1 text-sm">
                    <button onclick="openResetPasswordModal()" class="w-full text-left px-3 py-2 hover:bg-slate-700 rounded-lg">Change Password</button>
                    <button onclick="logout()" class="w-full text-left px-3 py-2 hover:bg-rose-600/20 text-rose-400 rounded-lg">Logout</button>
                </div>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <span class="bg-slate-700 px-3 py-1 rounded-full text-sm font-semibold">Wallet: ₹<span id="wallet-balance">0</span></span>
            <button onclick="openSearch()" class="p-2 hover:bg-slate-700 rounded-full">🔍</button>
            <button onclick="openNotifications()" class="p-2 hover:bg-slate-700 rounded-full">🔔</button>
            <button onclick="openSupport()" class="p-2 bg-indigo-600/20 text-indigo-400 rounded-full text-sm px-3">Support</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 space-y-6 mt-4">
        <!-- Scratch Card Section -->
        <div id="scratch-section" class="bg-gradient-to-r from-indigo-900 to-slate-800 p-6 rounded-2xl border border-indigo-500/30 text-center space-y-4">
            <h3 class="text-lg font-bold">Daily Scratch Card</h3>
            <div id="scratch-box" onclick="scratchCard()" class="w-full h-32 bg-slate-700 rounded-xl flex items-center justify-center cursor-pointer text-xl font-bold border-2 border-dashed border-indigo-400 hover:bg-slate-600 transition">
                Tap to Scratch & Win!
            </div>
        </div>

        <!-- Referral Section -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-3">
            <h3 class="text-lg font-bold text-indigo-400">Refer & Earn (7 Levels)</h3>
            <p class="text-sm text-slate-400">Share your referral link and earn commissions up to 7 levels deep!</p>
            <div class="flex gap-2">
                <input type="text" id="refer-link" readonly class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm">
                <button onclick="copyReferLink()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg text-sm font-semibold">Copy</button>
            </div>
        </div>
    </main>

    <!-- Reset Password Modal -->
    <div id="password-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-sm w-full space-y-4">
            <h3 class="text-lg font-bold">Set New Password</h3>
            <input type="password" id="new-password" placeholder="Enter New Password" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg">
            <div class="flex gap-2">
                <button onclick="updatePassword()" class="w-full py-2 bg-indigo-600 rounded-lg font-semibold">Update</button>
                <button onclick="closePasswordModal()" class="w-full py-2 bg-slate-700 rounded-lg font-semibold">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
